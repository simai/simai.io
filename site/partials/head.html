<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{DESCRIPTION}}">

  window.sfPath = '{{FRAMEWORK_BASE}}';

  window.SF_BOOT_CONFIG = {preloader: {enabled: false}, effects: {catalogue: '{{EFFECTS_BASE}}'}};
</script>
<script src="{{FRAMEWORK_BASE}}core/js/core.min.js"></script>
<link rel="stylesheet" href="{{ROOT}}assets/site.css?v={{COMMIT_SHORT}}">
